[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-mcp-oidc"
version = "0.1.1"
description = "Drop-in replacement for barryw/PaperlessMCP with per-caller OIDC identity passthrough"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "paperless-ngx", "oidc", "keycloak", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/munin92/paperless-mcp"
Repository = "https://github.com/munin92/paperless-mcp"
Issues = "https://github.com/munin92/paperless-mcp/issues"

[project.scripts]
paperless-mcp-oidc = "paperless_mcp_oidc.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
    "pyjwt[crypto]>=2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
path = "paperless_mcp_oidc/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# A curated, conventional set (pycodestyle, pyflakes, isort, pyupgrade,
# bugbear) rather than ruff's full preview rule set — the latter flags things
# like blind `except Exception` and naive datetimes that are deliberate
# choices here (see client.py/config.py comments), not defects.
select = ["E", "F", "I", "UP", "B"]
